<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore the Mountain Bean Café gallery and the Colorado scenery that inspires our coffee."
    >
    <meta name="robots" content="index, follow">

    <title>Mountain Bean Café | Gallery</title>

    <link rel="stylesheet" href="css/main.css">

    <link
        rel="preload"
        href="fonts/mountainbean.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

<script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-SPZB9PNXM2">
</script>

<script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
        dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-SPZB9PNXM2");
</script>
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header class="site-header">

        <nav class="nav" aria-label="Primary navigation">

            <a class="brand" href="index.html">
               <img
                    src="images/logo.jpg"
                    alt="Mountain Bean Café logo"
                    width="50"
                    height="50"
                >

                <span class="brand-name">
                    Mountain Bean Café
                </span>
            </a>

            <button
                class="nav-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="primary-menu"
                aria-label="Open navigation menu"
            >
                Menu
            </button>

            <ul id="primary-menu" class="menu">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="subscription.html">
                        Subscription
                    </a>
                </li>

                <li>
                    <a href="gallery.html" aria-current="page">
                        Gallery
                    </a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>

    <main id="main-content">

        <section class="page-content">

            <h1>Photo Gallery</h1>

            <p>
                A look at the mountain atmosphere and coffee culture
                behind Mountain Bean Café.
            </p>

            <div class="gallery">

                <figure>
                    <img
                        src="images/hero.jpg"
                        alt="Coffee beside a Colorado mountain stream"
                    >
                    <figcaption>
                        Coffee in the Rockies
                    </figcaption>
                </figure>

                <figure>
                    <img
                        src="images/coffee-beans.jpg"
                        alt="Fresh roasted coffee beans"
                    >
                    <figcaption>
                        Fresh Roasted Beans
                    </figcaption>
                </figure>

                <figure>
                    <img
                        src="images/latte.jpg"
                        alt="Fresh latte with decorative latte art"
                    >
                    <figcaption>
                        Crafted Café Drinks
                    </figcaption>
                </figure>

                <figure>
                    <img
                        src="images/cafe-interior.jpg"
                        alt="Warm and welcoming coffee shop interior"
                    >
                    <figcaption>
                        A Place to Slow Down
                    </figcaption>
                </figure>

                <figure>
                    <img
                        src="images/coffee-pour.jpg"
                        alt="Pour-over coffee being freshly brewed"
                    >
                    <figcaption>
                        Freshly Brewed
                    </figcaption>
                </figure>

                <figure>
                    <img
                        class="gallery-logo"
                        src="images/logo.jpg"
                        alt="Mountain Bean Café logo"
                    >
                    <figcaption>
                        Mountain Bean Café
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer class="site-footer">

        <div class="footer-content">

            <p>
                &copy; <span id="current-year">2026</span>
                Mountain Bean Café. All rights reserved.
            </p>

            <p>
                Fresh coffee. Mountain inspiration.
            </p>

        </div>

    </footer>

    <script>
        const navToggle = document.querySelector(".nav-toggle");
        const primaryMenu = document.getElementById("primary-menu");

        if (navToggle && primaryMenu) {
            navToggle.addEventListener("click", function () {

                const menuIsOpen =
                    navToggle.getAttribute("aria-expanded") === "true";

                navToggle.setAttribute(
                    "aria-expanded",
                    String(!menuIsOpen)
                );

                navToggle.setAttribute(
                    "aria-label",
                    menuIsOpen
                        ? "Open navigation menu"
                        : "Close navigation menu"
                );

                primaryMenu.classList.toggle("open");
            });

            primaryMenu.querySelectorAll("a").forEach(function (link) {

                link.addEventListener("click", function () {

                    navToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    navToggle.setAttribute(
                        "aria-label",
                        "Open navigation menu"
                    );

                    primaryMenu.classList.remove("open");
                });

            });
        }

        const currentYear =
            document.getElementById("current-year");

        if (currentYear) {
            currentYear.textContent =
                new Date().getFullYear();
        }
    </script>

</body>

</html>
